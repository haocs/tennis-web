[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tennis-coach-worker"
version = "0.6.0"
requires-python = ">=3.11"
description = "Independent media-export and multi-provider AI coaching workers"
[project.optional-dependencies]
pose = ["mediapipe>=1.2.3,<2.0"]
[project.scripts]
tennis-coach-worker = "tennis_coach.worker:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["tennis_coach*"]
[tool.setuptools.package-data]
tennis_coach = ["models/*.task", "models/MANIFEST.json", "models/LICENSE"]
